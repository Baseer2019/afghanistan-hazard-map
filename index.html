<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afghanistan Hazard Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      line-height: 1.35;
      min-width: 240px;
    }
    .popup-title {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .popup-row {
      margin: 2px 0;
    }
    .legend {
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      font-size: 12px;
      line-height: 1.4;
    }
    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", {
      preferCanvas: true
    }).setView([33.94, 67.71], 6);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    ).addTo(map);

    const deviceColors = {
      ERW: "#d32f2f",
      AIM: "#f57c00",
      APM: "#7b1fa2",
      ATM: "#1976d2",
      IED: "#455a64"
    };

    function colorForDevice(device) {
      if (!device) return "#9e9e9e";
      return deviceColors[String(device).toUpperCase()] || "#9e9e9e";
    }

    function popupHtml(p) {
      const area = Number(p["Hazard_Area"]);
      const formattedArea = Number.isFinite(area)
        ? area.toLocaleString()
        : p["Hazard_Area"] || "N/A";

      return `
        <div class="popup-title">${p["Hazard ID"] || "Hazard"}</div>
        <div class="popup-row"><b>Province:</b> ${p.Province || "N/A"}</div>
        <div class="popup-row"><b>District:</b> ${p.District || "N/A"}</div>
        <div class="popup-row"><b>Village:</b> ${p.Village || "N/A"}</div>
        <div class="popup-row"><b>Status:</b> ${p["Current Status"] || "N/A"}</div>
        <div class="popup-row"><b>Device:</b> ${p.Device || "N/A"}</div>
        <div class="popup-row"><b>Contaminated By:</b> ${p["Contaminated By"] || "N/A"}</div>
        <div class="popup-row"><b>Hazard Area:</b> ${formattedArea} m²</div>
        <div class="popup-row"><b>Latitude:</b> ${p.Latitude || "N/A"}</div>
        <div class="popup-row"><b>Longitude:</b> ${p.Longitude || "N/A"}</div>
      `;
    }

    fetch("./hazards.geojson")
      .then((res) => res.json())
      .then((geojson) => {
        const layer = L.geoJSON(geojson, {
          pointToLayer: (feature, latlng) =>
            L.circleMarker(latlng, {
              radius: 5,
              fillColor: colorForDevice(feature.properties.Device),
              color: "#ffffff",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.9
            }),
          onEachFeature: (feature, lyr) => {
            lyr.bindPopup(popupHtml(feature.properties));
          }
        }).addTo(map);

        map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      })
      .catch((err) => {
        console.error(err);
        alert("Could not load hazards.geojson. Please run through a local web server.");
      });

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <div><b>Device Legend</b></div>
        <div><i style="background:#d32f2f"></i> ERW</div>
        <div><i style="background:#f57c00"></i> AIM</div>
        <div><i style="background:#7b1fa2"></i> APM</div>
        <div><i style="background:#1976d2"></i> ATM</div>
        <div><i style="background:#455a64"></i> IED</div>
        <div><i style="background:#9e9e9e"></i> Other</div>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
